<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#183e36"><title>BioSentry AI · Workspace</title><link rel="stylesheet" href="style.css"></head>
<body><a class="skip" href="#main">Skip to workspace</a><div class="shell">
<aside id="side"><div class="brand"><canvas data-art="mark" width="40" height="40"></canvas><span>BioSentry <i>AI</i></span></div>
<button class="new" id="new"><b>＋</b> New chat</button><button class="sidebtn" id="search"><i data-icon="search"></i>Search chats</button><button class="sidebtn" id="library"><i data-icon="book"></i>Source library</button>
<div class="sidehead">Conversations</div><div id="history"></div><div class="foot"><button id="profile"><span id="avatar">G</span><span><strong id="username">Guest workspace</strong><small id="accountHint">Sign in to save chats</small></span><span aria-hidden="true">›</span></button></div></aside>
<button id="shade" aria-label="Close navigation"></button><main id="main"><header><button id="menu" aria-label="Open navigation">☰</button><span id="crumb">Workspace</span><span class="slash">/</span><strong id="pageTitle">New chat</strong><div class="headerActions"><button id="deleteChat" hidden>Delete chat</button><button id="headerAccount">Sign in <span>↗</span></button></div></header>
<section id="workspace"><div id="home"><div class="heroart"><canvas data-art="hero" width="112" height="94"></canvas></div><h1>What would you like<br>to <em>explore?</em></h1><p class="sub">Ask about Ayurveda, ingredients and the evidence behind them.</p></div>
<div id="messages" aria-live="polite"></div><div id="composeArea"><form id="composer"><div class="editBanner" id="editBanner" hidden><span>Editing your last message</span><button id="cancelEdit" type="button">Cancel</button></div><label class="sr" for="prompt">Your question</label><textarea id="prompt" maxlength="1500" rows="2" placeholder="Ask BioSentry a question…"></textarea><div class="composeFoot"><span id="composeMode"><b class="dot"></b> Reference library</span><span id="workStatus" role="status" hidden></span><button id="stopAnswer" type="button" hidden>Stop</button><button id="send" aria-label="Send message" type="submit">↑</button></div></form></div>
<div id="ideas"><p>Start with a question</p><div class="cards"><button data-question="I have a headache."><canvas data-art="sprig" width="48" height="40"></canvas><span>Describe a concern</span><small>Try “I have a headache”</small></button><button data-question="Which part of ginger is used in food?"><canvas data-art="root" width="48" height="40"></canvas><span>Explore a plant part</span><small>Inside a ginger rhizome</small></button><button data-question="Where does this information come from?"><canvas data-art="book" width="48" height="40"></canvas><span>Check the evidence</span><small>Open the original source</small></button></div></div>
<div id="notice" role="status"></div></section></main></div><dialog id="dialog" aria-labelledby="dialogTitle"><div class="dialogHead"><h2 id="dialogTitle"></h2><button id="close" aria-label="Close dialog">×</button></div><div id="dialogBody"></div></dialog><dialog id="sourceDrawer" aria-labelledby="sourceTitle"><div class="dialogHead"><h2 id="sourceTitle">Source details</h2><button id="closeSource" aria-label="Close source details">×</button></div><div id="sourceBody"></div></dialog><script src="app.js" defer></script></body></html>
