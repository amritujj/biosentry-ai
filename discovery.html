const questions=topics.flatMap((group,section)=>group.items.map(item=>({...item,section})));
const $=id=>document.getElementById(id), key="biosentry-discovery-v1", schema="biosentry-discovery-v1";
const seed={Q001:{v:[0]},Q002:{v:[1]},Q003:{v:["other"],other:"wo user ko ayurvedic illaj aur gharelu nushkhe batayega user ke problem ko samjh ke, aur ayurvedic aur gharelu nushkhe ke data ko hum apne ai me feed karenge aur train karenge"},Q004:{v:[0]},Q005:{v:[3]}};

function done(i){const a=answers[id(i)];return Boolean(a?.v?.some(x=>x!=="other"||a.other?.trim()));}
try{const old=JSON.parse(localStorage.getItem(key));if(old?.schema===schema){answers=clean(old.answers);if(Number.isInteger(old.cursor))cursor=Math.max(0,Math.min(199,old.cursor));}}catch{}
function write(){try{localStorage.setItem(key,JSON.stringify({schema,cursor,answers}));$("save").textContent="Browser mein saved";}catch{$("save").textContent="Local save unavailable · backup download karo";}}

function show(focus=false){const q=questions[cursor],a=current();$("section").value=q.section;$("number").textContent=id(cursor)+" / 200";$("question").textContent=q.q;$("hint").textContent=q.m?"Ek ya zyada options chuno.":"Ek option chuno.";$("choices").replaceChildren();

for(const [idx,t] of choices){const label=document.createElement("label");label.className="opt";const input=document.createElement("input");input.type=q.m?"checkbox":"radio";input.name="choice";input.checked=a.v.includes(idx);const l=document.createElement("span");l.textContent=(typeof idx==="number"?String.fromCharCode(65+idx)+". ":"")+t;label.append(input,l);$("choices").append(label);input.onchange=()=>{if(!q.m||idx==="na"||idx==="unsure")a.v=input.checked?[idx]:[];else{a.v=a.v.filter(x=>x!=="unsure"&&x!=="na"&&x!==idx);if(input.checked)a.v.push(idx);}write();show();if(idx==="other"&&input.checked)$("other").focus();};}
$("otherBox").hidden=!a.v.includes("other");$("other").value=a.other||"";$("note").value=a.note||"";$("notes").open=!!a.note;$("prev").disabled=cursor===0;$("next").textContent=cursor===199?"Answers download ↓":"Agla →";status();if(focus)$("question").focus();}

function download(){const records=questions.flatMap((q,i)=>{const a=answers[id(i)];if(!a||(!a.v.length&&!a.note?.trim()&&!a.other?.trim()))return [];return [{id:id(i),topic:topics[q.section].title,question:q.q,selected:a.v.map(x=>x==="other"?a.other||"":x==="unsure"?"Abhi tay nahi":x==="na"?"Lagu nahi":q.o[x]),detail:a.note||""}];});const blob=new Blob([JSON.stringify({schema,cursor,answers,records},null,2)],{type:"application/json"});const url=URL.createObjectURL(blob),link=document.createElement("a");link.href=url;link.download="BioSentry-project-answers.json";link.click();setTimeout(()=>URL.revokeObjectURL(url),4000);}
